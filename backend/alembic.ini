# Alembic configuration for the AI-Assistant app database.
#
# The database URL is NOT hard-coded here (no secrets in committed files) — env.py
# pulls it from app.core.config.get_settings().APP_DATABASE_URL (i.e. from .env).
#
# Usage:
#   cd backend
#   alembic upgrade head            # apply migrations (fresh prod install)
#   alembic revision --autogenerate -m "msg"   # create a migration from model changes
#
# NOTE: dev/test still use Base.metadata.create_all (see app/db/session.py). Alembic is
# the authoritative path for evolving an EXISTING database (ALTERs, new columns, pgvector)
# where create_all cannot help.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timezone for migration filenames/timestamps.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
