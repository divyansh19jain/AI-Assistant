# Production-style stack. Works as-is on local Docker Desktop and as a Coolify
# "Docker Compose" deployment on Proxmox.
#
#   Local:   cp .env.example .env  &&  docker compose up --build -d
#            -> http://localhost:3000
#   Dev:     docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The frontend proxies browser /api/* calls to the backend over the internal network
# (see frontend/next.config.js), so only the frontend needs a public domain and the
# backend stays internal.
name: ai-assistant

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_assistant}
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost: reachable for debugging, never published to the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5499}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_assistant} -d ${POSTGRES_DB:-ai_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_assistant}:${POSTGRES_PASSWORD:-ai_assistant}@db:5432/${POSTGRES_DB:-ai_assistant}
      USE_MOCK_EMR: ${USE_MOCK_EMR:-true}
      EMR_DATABASE_URL: ${EMR_DATABASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      WEB_SUBMIT_DRIVER: ${WEB_SUBMIT_DRIVER:-mock}
      BROWSERLESS_URL: ${BROWSERLESS_URL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - pdf_data:/app/app/pdf/generated_pdfs
    # Optional: exposes /docs on localhost. The browser does NOT use this — the
    # frontend proxies /api internally. Safe to remove on a hardened server.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty -> same-origin /api proxy (recommended). Set to an absolute URL for split-domain.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  pdf_data:
